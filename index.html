<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Portfolio Page</title>
<!-- Google Font chosen to compliment the creative theme of the work -->
<link href="https://googleapis.com" rel="stylesheet">
<style>
    body {
        background: whitesmoke;
    } 
    /* Centers the page with a border and drop-shadow */
    #page {
        width: 928px;
        margin: 0 auto;
        padding: 48px;
        background: white;
        border: 1px solid darkgray;
        box-shadow: 2px 3px 6px darkgray;
    } 
    h1 {
        font: 48pt/1.0em 'Dancing Script', cursive;
        text-align: center;
        text-shadow: 2px 3px 6px darkorange;
    }
    /* The flexible box layout text box, sized slightly smaller than the page */
    #textbox {
        width: 800px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        align-content: flex-start;
    } 
    /* Figure tag styled to the exact same 200px width as the image tag */
    figure {
        width: 200px;
        margin: 20px;
    } 
    /* Thumbnail image tag with fixed portrait dimensions */
    img {
        width: 200px;
        height: 300px;
        border: 1px solid dimgray;
        box-shadow: 2px 3px 6px darkgray;
    } 
    /* Figcaption styled with a minimum 12pt type, italicized, and centered */
    figcaption {
        font: italic 12pt/1.4em Georgia, serif;
        text-align: center;
        margin-top: 8px;
    }
</style>
</head>

<body>
<div id="page">
    <h1>Portfolio</h1>

    <!-- The required flexbox div container -->
    <div id="textbox">
        
        <!-- Work 1: Graphic 230921 -->
        <figure>
            <a href="230921.png">
                <img src="230921.png" alt="Graphic 230921 Thumbnail">
            </a>
            <figcaption>
                This digital artwork, titled 230921, explores modern graphic patterns and visual textures.
            </figcaption>
        </figure>

        <!-- Work 2: Graphic 231442 -->
        <figure>
            <a href="231442.png">
                <img src="231442.png" alt="Graphic 231442 Thumbnail">
            </a>
            <figcaption>
                A creative design piece created to highlight experimental compositions and color layouts.
            </figcaption>
        </figure>

        <!-- Work 3: Graphic 232502 -->
        <figure>
            <a href="232502.png">
                <img src="232502.png" alt="Graphic 232502 Thumbnail">
            </a>
            <figcaption>
                A poster-style graphic designed as part of a progressive digital media portfolio series.
            </figcaption>
        </figure>

    </div>
</div>
</body>
</html>
